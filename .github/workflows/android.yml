
name: ساخت استودیو تدوین فارسی

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: ساخت نسخه اندروید
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: آماده‌سازی پروژه Flutter
        run: flutter create . --platforms=android

      - name: نصب Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: تنظیم نسخه Android SDK برنامه
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          for file in files:
              if file.exists():
                  content = file.read_text()
                  content = content.replace(
                      "compileSdk = flutter.compileSdkVersion",
                      "compileSdk = 36"
                  )
                  content = content.replace(
                      "compileSdkVersion flutter.compileSdkVersion",
                      "compileSdkVersion 36"
                  )
                  file.write_text(content)
                  print("Updated:", file)
          PY

      - name: دریافت کتابخانه‌ها
        run: flutter pub get

      - name: اصلاح SDK کتابخانه file_picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          cache = Path(os.environ.get(
              "PUB_CACHE",
              str(Path.home() / ".pub-cache")
          ))

          files = list(
              cache.glob("hosted/pub.dev/file_picker-*/android/build.gradle*")
          )

          if not files:
              raise SystemExit("ERROR: file_picker Gradle file not found")

          for file in files:
              content = file.read_text()

              content = re.sub(
                  r'(?m)^(\s*)compileSdkVersion\s+.*$',
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              content = re.sub(
                  r'(?m)^(\s*)compileSdk\s*=\s*.*$',
                  r'\g<1>compileSdk = 36',
                  content
              )

              file.write_text(content)

              print("FILE:", file)
              for line in content.splitlines():
                  if "compileSdk" in line:
                      print("SDK SETTING:", line.strip())

          PY

      - name: ساخت APK
        run: flutter build apk --release

      - name: ذخیره فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: Persian-Studio-Android
          path: build/app/outputs/flutter-apk/app-release.apk
