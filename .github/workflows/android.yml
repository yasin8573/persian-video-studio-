

name: ساخت استودیو تدوین فارسی

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: ساخت نسخه اندروید
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: آماده‌سازی پروژه Flutter
        run: flutter create . --platforms=android

      - name: نصب Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: تنظیم نسخه Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          for file in files:
              if file.exists():
                  content = file.read_text()
                  content = content.replace(
                      "compileSdk = flutter.compileSdkVersion",
                      "compileSdk = 36"
                  )
                  content = content.replace(
                      "compileSdkVersion flutter.compileSdkVersion",
                      "compileSdkVersion 36"
                  )
                  file.write_text(content)
                  print("Updated:", file)
          PY

      - name: دریافت کتابخانه‌ها
        run: flutter pub get

      - name: ساخت APK
        run: flutter build apk --release

      - name: ذخیره فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: Persian-Studio-Android
          path: build/app/outputs/flutter-apk/app-release.apk
